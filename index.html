<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd9e3">
  <title>Happy Anniversary 💗</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap');
:root{--pink:#ffdce5;--deep:#a90043;--text:#b42c5b;--soft:#d86c8b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--pink);font-family:Quicksand, sans-serif;color:var(--text);overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 15%,#fff7fa88,transparent 32%),radial-gradient(circle at 80% 80%,#ffc3d588,transparent 35%);pointer-events:none}
main{position:relative;width:100%;max-width:430px;height:100dvh;min-height:570px;margin:auto;overflow:hidden}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px 27px 34px;animation:fade .65s ease both}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(21px,6vw,27px);line-height:1.22;font-weight:700;letter-spacing:.3px;margin:25px 0 9px;color:#b52c5b}
h1 span{color:#ad174e}
p{margin:8px 0}
.sub{font-size:12px;color:#c77b91;margin:9px 0 19px}
.body-copy{font-size:13px;line-height:1.8;max-width:280px}
.soft-copy{font-size:12px;line-height:1.8;max-width:285px;color:#b96d83}
.pill{border:0;border-radius:30px;background:var(--deep);color:white;padding:10px 27px;font:700 11px Quicksand;min-width:76px;box-shadow:0 5px 12px #a9004320;cursor:pointer;transition:.2s}
.pill:active{transform:scale(.94)}
.pill span{margin-left:5px}
.gift-scene{height:230px;display:grid;place-items:center;position:relative;width:100%}
.gift{position:relative;width:150px;height:130px;margin-top:45px;animation:bob 2s ease-in-out infinite}
.gift-box{position:absolute;bottom:0;width:150px;height:92px;background:repeating-linear-gradient(90deg,#ff8e9e 0 18px,#ffd2d6 18px 36px);border:3px solid #5c2530;border-radius:3px;box-shadow:inset 0 -7px #e96b80}
.ribbon{position:absolute;left:66px;top:0;height:100%;width:16px;background:#f6a1ad;border-left:2px solid #71333b;border-right:2px solid #71333b}
.ribbon.vertical{display:none}
.gift-lid{position:absolute;z-index:2;top:0;left:-8px;width:166px;height:28px;background:#ff8f9e;border:3px solid #5c2530;transform:rotate(-2deg);border-radius:3px}
.bow{position:absolute;left:66px;top:-21px;width:30px;height:22px;border:3px solid #5c2530;border-radius:80% 10% 80% 10%;transform:rotate(25deg);background:#ffb3c0}
.bow:after{content:"";position:absolute;width:30px;height:22px;border:3px solid #5c2530;border-radius:10% 80% 10% 80%;left:12px;top:-3px;background:#ffb3c0}
.bunny-in-gift{position:absolute;z-index:1;top:-44px;left:47px;font-size:54px;opacity:0;transition:.5s}
#gift-screen.opened .bunny-in-gift{opacity:1;transform:translateY(-15px)}
#gift-screen.opened .gift-lid{transform:translate(-20px,-48px) rotate(-18deg)}
@keyframes bob{50%{transform:translateY(-7px)}}
.calendar-envelope{width:210px;height:245px;position:relative;margin:0 auto 8px}
.calendar{position:absolute;z-index:2;top:0;left:12px;width:186px;height:165px;border-radius:12px;background:#fff0f5;padding:12px 10px 6px;box-shadow:0 4px 12px #c15c7b22}
.cal-top{font-size:10px;color:#ed8da8;height:19px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.week span{font-size:8px;color:#dc7594}
.days span{font-size:8px;padding:3px 0;color:#bd5678}
.days .marked{background:#ed6590;color:white;border-radius:50%}
.month-script{font:20px Pacifico;color:#e45c8a;margin-top:5px}
.envelope{position:absolute;bottom:0;left:15px;width:180px;height:125px;border-radius:0 0 13px 13px;background:linear-gradient(145deg,#ffb6c7,#f27d9f);box-shadow:0 7px 12px #c15c7b22;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.envelope:before,.envelope:after{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid}
.envelope:before{left:0;border-width:0 90px 72px 0;border-color:transparent #ffcada transparent transparent}
.envelope:after{right:0;border-width:0 0 72px 90px;border-color:transparent transparent transparent #ffd4df}
.flap{position:absolute;top:0;left:0;width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-top:72px solid #ff9eb5;z-index:2}
.seal{position:absolute;z-index:3;top:52px;left:78px;color:#d52e68;font-size:25px}
.big-bunny,.dancing-bunny,.couple-bunny{font-size:112px;filter:drop-shadow(0 5px 2px #d76c8520);animation:bob 2.4s infinite}
.dancing-bunny{font-size:95px}
#thanks-screen .soft-copy{margin:12px 0 25px}
#days-screen h1{margin:15px 0 8px}
.photo-grid{width:min(100%,310px);display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:26px}
.photo{height:115px;border-radius:15px;overflow:hidden;background:#f4a8bd;box-shadow:0 3px 9px #b64e6e25}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.placeholder{background:linear-gradient(135deg,#f5a9bd,#ffe8ee);position:relative}
.photo.placeholder:after{content:"add your photo";position:absolute;inset:0;display:grid;place-items:center;color:#a94367;font-size:11px}
.heart-envelope{width:145px;height:105px;margin-bottom:20px;position:relative;background:#fff0f4;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);filter:drop-shadow(0 5px 5px #d46a8a30)}
.heart-envelope:before{content:"";position:absolute;inset:0;background:#ffc1cf;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.heart-envelope span{position:absolute;color:#f52c3e;font-size:38px;z-index:2;top:-28px;left:60px;animation:heart 1.3s infinite}
.heart-envelope span:nth-child(2){font-size:23px;left:22px;top:-5px}
.heart-envelope span:nth-child(3){font-size:19px;left:105px;top:9px}
@keyframes heart{50%{transform:scale(1.2)}}
.letter-screen{justify-content:flex-start;overflow-y:auto;padding-top:55px;padding-bottom:25px}
.letter{width:100%;max-width:330px;text-align:left;border-left:2px solid #e98baa;padding:4px 0 4px 13px;font-size:12px;line-height:1.85;color:#a94d6b}
.letter h1{text-align:center;font-size:20px;line-height:1.5;margin:0 0 5px}
.letter .tiny-face{text-align:center;font-size:15px;margin:4px}
.letter .salutation{margin-top:20px}
.letter .signature{font-style:italic;text-align:right;margin-top:20px}
.letter-screen .pill{margin-top:20px;flex-shrink:0}
#end-screen .couple-bunny{font-size:105px;margin-bottom:15px}
.floaties{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.floaty{position:absolute;top:-30px;opacity:.75;animation:fall linear infinite;user-select:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(min-width:600px){body{display:grid;place-items:center;background:#f9cbd8}main{height:min(850px,94dvh);border-radius:28px;box-shadow:0 15px 55px #a9446425}}

  
button, .pill { position: relative; z-index: 20; pointer-events: auto; touch-action: manipulation; }
.screen { pointer-events: auto; }
.floaties { pointer-events: none !important; }

/* Pink Aero Frutiger + Liquid Glass */
:root{--pink:#ffdce9;--deep:#a92e62;--text:#a94b70;--soft:#d8799b}
body{background:radial-gradient(ellipse at 15% 12%,rgba(255,255,255,.96),transparent 34%),radial-gradient(ellipse at 88% 22%,rgba(255,255,255,.72),transparent 30%),radial-gradient(ellipse at 70% 92%,rgba(255,173,207,.75),transparent 38%),linear-gradient(145deg,#f8c8dc 0%,#ffe8f0 48%,#f7c3da 100%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:radial-gradient(circle at 12% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 84% 62%,#fff 0 3px,transparent 4px),radial-gradient(circle at 55% 12%,#fff 0 1px,transparent 2px);background-size:130px 130px,190px 190px,90px 90px}
.screen{gap:10px}
.glass-panel,.calendar,.letter,.photo{background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,240,247,.48));border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 30px rgba(159,65,104,.12),inset 0 1px 0 rgba(255,255,255,.95);backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35)}
.glass-panel{position:relative;isolation:isolate;overflow:hidden;padding:13px 18px;border-radius:22px;max-width:315px;margin:5px auto 13px}
.glass-panel:before,.calendar:before{content:"";position:absolute;inset:0 0 auto;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.62),transparent);pointer-events:none;border-radius:inherit}
.glass-panel>*{position:relative}.glass-panel h1{margin:2px 0 8px}.glass-panel p{margin:5px 0}
h1{text-shadow:0 1px 0 rgba(255,255,255,.85)}
.pill{background:linear-gradient(180deg,#e978a5,#c43d78);border:1px solid rgba(255,255,255,.82);box-shadow:0 6px 15px rgba(166,44,94,.2),inset 0 1px 0 rgba(255,255,255,.6);padding:11px 29px}
.calendar{overflow:hidden;border-radius:17px}.week span{font-weight:700}.days{row-gap:4px}.days span{font-weight:600}
.days .empty-day{visibility:hidden}.days .marked{background:linear-gradient(145deg,#f28bb2,#c93e78);color:#fff;border:1px solid #fff;box-shadow:0 3px 8px #c64b7b45}
.month-script{font-family:Quicksand,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px}
.photo-grid{width:min(100%,330px);gap:12px}
.photo{position:relative;height:148px;padding:8px 8px 25px;border-radius:5px;background:linear-gradient(145deg,#fff,#fff3f7)}
.photo:nth-child(1){transform:rotate(-1.5deg)}.photo:nth-child(2){transform:rotate(1.5deg)}.photo:nth-child(3){transform:rotate(1.2deg)}.photo:nth-child(4){transform:rotate(-1.2deg)}
.photo img{height:100%;border-radius:2px;position:relative;z-index:1}
.photo span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.7px;color:#b85b7c;font-weight:700}
.photo.placeholder:after{inset:8px 8px 25px;border-radius:2px;font-size:10px}
.letter{border-radius:22px;border:1px solid rgba(255,255,255,.9);padding:20px 18px;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,240,247,.6))}
.love-mark{color:#d94e86;font-family:Georgia,serif;font-size:116px;line-height:1;width:155px;height:155px;display:grid;place-items:center;border-radius:44px;background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(255,218,234,.45));border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 32px rgba(173,66,111,.15),inset 0 1px 0 white;text-shadow:0 7px 12px rgba(196,55,112,.16);animation:loveEntrance 2s ease-in-out both}
.ending-love{font-size:100px}
@keyframes loveEntrance{0%{opacity:0;transform:translateY(24px) scale(.55) rotate(-16deg)}35%{opacity:1;transform:translateY(0) scale(1.12) rotate(8deg)}52%{transform:scale(.96) rotate(-7deg)}68%{transform:scale(1.04) rotate(5deg)}82%{transform:scale(.99) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@media(min-width:600px){main{background:rgba(255,255,255,.16);backdrop-filter:blur(10px)}}


/* ===== iOS-inspired Pink Liquid Glass ===== */
:root{--pink:#f9dce8;--deep:#bd527e;--text:#98536e;--soft:#c47b98}
body{
 background:
  radial-gradient(ellipse at 18% 8%,rgba(255,255,255,.95),transparent 32%),
  radial-gradient(ellipse at 92% 18%,rgba(255,255,255,.66),transparent 30%),
  radial-gradient(ellipse at 60% 95%,rgba(241,167,196,.58),transparent 42%),
  linear-gradient(145deg,#f5d4e1,#fceaf1 48%,#f4d2e0);
 color:#98536e;
}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background:radial-gradient(circle at 20% 20%,white 0 1px,transparent 2px),radial-gradient(circle at 80% 70%,white 0 2px,transparent 3px);background-size:100px 100px,150px 150px}
.screen{padding:26px 24px 150px;gap:9px}
h1{color:#9f4c70;text-shadow:0 1px 2px rgba(255,255,255,.9)}
.glass-panel,.calendar,.letter,.photo{
 background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,244,249,.28));
 border:1px solid rgba(255,255,255,.78);
 box-shadow:0 12px 34px rgba(145,71,102,.10),inset 0 1px 0 rgba(255,255,255,.9);
 backdrop-filter:blur(24px) saturate(1.55);-webkit-backdrop-filter:blur(24px) saturate(1.55)
}
.glass-panel{border-radius:24px}
.pill{background:linear-gradient(180deg,rgba(207,112,151,.95),rgba(172,73,116,.96));border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 22px rgba(160,73,111,.2),inset 0 1px 1px rgba(255,255,255,.65)}
.letter{border-radius:26px}
.photo-grid{display:none}

/* scrapbook memory scene */
.memory-scene{
 width:min(100%,340px);height:390px;position:relative;overflow:hidden;border-radius:25px;
 background:
  radial-gradient(ellipse at 25% 20%,rgba(255,255,255,.12),transparent 40%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px),
  linear-gradient(135deg,#4b172b,#751f3d 48%,#3c1428);
 box-shadow:0 18px 38px rgba(80,24,49,.24),inset 0 1px rgba(255,255,255,.18);
}
.memory-scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.25));pointer-events:none}
.scrap-paper{
 position:absolute;right:12px;top:35px;width:55%;height:300px;padding:18px 12px;
 transform:rotate(8deg);background:linear-gradient(145deg,#fffefa,#f4e9e5);
 color:#59444c;box-shadow:0 12px 24px rgba(0,0,0,.28);text-align:center;
}
.cherries{font-size:30px;line-height:1.2;margin:2px 0 8px;filter:drop-shadow(0 2px 2px #0002)}
.scrap-date{font-size:9px;letter-spacing:3px;color:#a68c92}
.scrap-title{font-family:Georgia,serif;font-style:italic;font-size:25px;margin:22px 0 24px;color:#57404a}
.mini-calendar{font-size:10px;letter-spacing:2px;border-top:1px solid #d8c9c7;border-bottom:1px solid #d8c9c7;padding:10px 0}
.mini-calendar b{display:block;font-size:16px;margin:5px}
.mini-calendar span{display:block;margin-top:14px;color:#bd527e;font-size:15px}
.paper-note{font-family:Georgia,serif;font-style:italic;font-size:10px;margin-top:22px;color:#9a7884}
.photostrip{
 position:absolute;left:18px;top:18px;width:43%;padding:9px 9px 12px;
 background:#f7f4ef;transform:rotate(-5deg);box-shadow:0 12px 22px rgba(0,0,0,.3);
 display:flex;flex-direction:column;gap:7px;z-index:2;
}
.strip-photo{width:100%;height:66px;background:#e9dfe0;overflow:hidden}
.strip-photo img{width:100%;height:100%;object-fit:cover;display:block}
.strip-photo.placeholder{background:linear-gradient(135deg,#e9bdcc,#f7e9ee);position:relative}
.strip-photo.placeholder:after{content:"your photo";position:absolute;inset:0;display:grid;place-items:center;color:#a05a78;font-size:10px}
.strip-caption{font:8px Georgia,serif;letter-spacing:1.2px;text-align:center;color:#6c5660;padding-top:3px}
.memory-glass-tag{
 position:absolute;z-index:4;left:50%;bottom:13px;transform:translateX(-50%);
 white-space:nowrap;padding:9px 16px;border-radius:30px;color:#fff;font-size:10px;letter-spacing:.5px;
 background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);
 box-shadow:0 6px 18px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.45);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}

/* floating music glass window */
.music-player{
 position:fixed;z-index:40;left:50%;bottom:14px;transform:translateX(-50%);
 width:min(calc(100% - 24px),390px);padding:11px 13px 10px;border-radius:25px;
 color:#87516a;background:linear-gradient(135deg,rgba(255,255,255,.73),rgba(255,238,246,.43));
 border:1px solid rgba(255,255,255,.82);
 box-shadow:0 14px 40px rgba(118,54,82,.18),inset 0 1px 0 rgba(255,255,255,.95);
 backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6)
}
.player-top{display:flex;align-items:center;gap:10px}
.album-art{width:48px;height:48px;flex-shrink:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b34e79;background:radial-gradient(circle at 25% 20%,#fff,#f5bcd0 65%,#e99bb9);box-shadow:inset 0 1px 2px #fff,0 4px 12px #b65c7c25}
.album-art span{font-size:22px;line-height:20px}.album-art small{font-size:6px;letter-spacing:1px}
.track-meta{min-width:0;flex:1;text-align:left;display:flex;flex-direction:column;gap:3px}
.track-meta strong{font-size:12px;color:#8e4664;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-meta small{font-size:9px;color:#b27b91}
.icon-btn,.control-btn{border:0;color:#9e5271;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);border-radius:50%;display:grid;place-items:center}
.icon-btn{width:34px;height:34px;font-size:18px}
.progress-wrap{margin:8px 1px 1px}
#seekbar{width:100%;height:4px;display:block;accent-color:#bd6289}
.time-row{display:flex;justify-content:space-between;font-size:8px;color:#ad7b90;margin-top:2px;font-variant-numeric:tabular-nums}
.player-controls{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:4px}
.control-btn{width:31px;height:31px;font-size:13px}
.play-control{width:39px;height:39px;font-size:15px;background:linear-gradient(145deg,#fff,#f5d5e2);box-shadow:0 4px 12px #a94e7320}
.add-audio{font-size:9px;color:#9e5271;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.38);border-radius:20px;padding:7px 10px}
.add-audio input{display:none}
.playlist-panel{display:none;margin-top:10px;padding-top:9px;border-top:1px solid rgba(181,113,143,.18)}
.playlist-panel.open{display:block}
.playlist-heading{font-size:9px;letter-spacing:1.5px;text-align:left;margin-bottom:7px;color:#a05a78}
.playlist-heading span{float:right}
.playlist-list{display:flex;flex-direction:column;gap:5px}
.track-row{width:100%;border:0;border-radius:12px;background:rgba(255,255,255,.36);padding:8px 10px;text-align:left;color:#90516c;font-size:10px;display:flex;justify-content:space-between;align-items:center}
.track-row.active{background:rgba(218,145,174,.28);border:1px solid rgba(255,255,255,.65)}
.track-row small{font-size:8px;color:#b17b91}
.playlist-hint{font-size:8px;color:#af8295;text-align:left;margin:7px 2px 0;line-height:1.5}
.welcome-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(115,54,79,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.welcome-overlay.hidden{display:none}
.welcome-glass{width:min(100%,330px);padding:28px 22px 24px;border-radius:32px;text-align:center;color:#96536e;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,237,245,.48));border:1px solid rgba(255,255,255,.9);box-shadow:0 25px 65px rgba(117,48,77,.2),inset 0 1px 0 white;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.welcome-orb{width:74px;height:74px;margin:0 auto 17px;border-radius:24px;display:grid;place-items:center;font-size:43px;color:#c05b87;background:linear-gradient(145deg,#fff,#f3c7d9);box-shadow:inset 0 1px 1px white,0 10px 22px #b35b7d25}
.welcome-kicker{font-size:8px;letter-spacing:2px;color:#bb7b96}
.welcome-glass h2{font-family:Georgia,serif;font-weight:400;font-style:italic;font-size:28px;margin:9px 0;color:#97516f}
.welcome-glass p:not(.welcome-kicker){font-size:11px;line-height:1.8;color:#ad7890}
.welcome-glass button{margin-top:13px;border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:12px 25px;color:white;font-weight:700;background:linear-gradient(145deg,#d68bab,#b95d85);box-shadow:0 8px 20px #ad5d7d35}
.welcome-glass small{display:block;margin-top:12px;font-size:8px;color:#b38a9b}
button,input{touch-action:manipulation}
@media(max-height:700px){.music-player{bottom:6px}.screen{padding-bottom:138px}.memory-scene{height:340px}.strip-photo{height:55px}.scrap-paper{height:265px}}


/* iOS-inspired pink Liquid Glass music player */
.cassette-toggle{position:fixed;z-index:80;top:max(14px,env(safe-area-inset-top));right:16px;width:43px;height:43px;border-radius:15px;border:1px solid rgba(255,255,255,.82);color:#a83e68;font-size:20px;background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,220,235,.42));box-shadow:0 8px 24px rgba(155,65,101,.17),inset 0 1px 0 #fff;backdrop-filter:blur(22px) saturate(1.45);-webkit-backdrop-filter:blur(22px) saturate(1.45);display:grid;place-items:center;cursor:pointer;transition:transform
